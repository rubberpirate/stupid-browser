[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "stupid-browser-scratch"
version = "0.1.0"
description = "A tiny educational browser that renders HTML and CSS with a PySide6 GUI"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
	"PySide6>=6.8",
]

[project.scripts]
stupid-browser = "stupid_browser_scratch.main:main"

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
where = ["."]
include = ["stupid_browser_scratch*"]

[tool.setuptools.package-data]
stupid_browser_scratch = ["default.css"]
